name: Tests

# Runs tests/run-tests.sh (levels unit, cli and module: no network besides installing the programs, no reference
# database) on every push and pull request; the result is shown as a check mark on each commit
on:
  push:
    branches: [ "main", "restructure-pipeline", "docker" ]
  pull_request:
  workflow_dispatch:                           # manual run (Actions tab)

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}                    # login shell: the micromamba environment is active in every step
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Programs of the genome search, of the rebuild of the reference tables (setup) and of the download-wf steps that
      # the tests run for real (seqkit, Pyrodigal: pinned, the expected tables have its gene counts); shellcheck comes
      # with the runner; the other programs of download-wf are the fake ones of tests/bin; without R, no graph is drawn
      - name: Install the programs (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: prokfinder-tests
          create-args: >-
            -c conda-forge -c bioconda
            bash gawk jq unzip ncbi-datasets-cli=18 taxonkit=0.20 seqkit=2.12 python=3.12 pyrodigal=3.7.1
          cache-environment: true

      # bats-core pinned to the version used locally
      - name: Install bats-core
        run: |
          git clone --quiet --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "${RUNNER_TEMP}/bats-core"
          sudo "${RUNNER_TEMP}/bats-core/install.sh" /usr/local
          bats --version
          shellcheck --version | awk 'NR == 2'
          datasets --version
          taxonkit version
          seqkit version
          python3 -c 'import pyrodigal; print("pyrodigal", pyrodigal.__version__)'

      - name: Run the tests
        run: tests/run-tests.sh
